name: Feedback bot bridge tests

on:
  push:
    paths:
      - 'bot-bridge/**'
      - '.github/workflows/feedback-bot-bridge.yml'
  pull_request:
    paths:
      - 'bot-bridge/**'
      - '.github/workflows/feedback-bot-bridge.yml'

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile Python bridge
        run: python3 -m py_compile bot-bridge/feedback_helper.py
      - name: Run bridge unit tests
        run: python3 -m unittest discover -s bot-bridge/tests -v
